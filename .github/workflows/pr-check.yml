name: Enterprise CI / PR Validation

on:
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - dev

# Cancel previous in-flight runs on the same branch when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security & Secret Leak Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Secrets Committed
        run: |
          if [ -f .env ]; then
            echo "::error::CRITICAL: .env file found in repo! Do not commit secrets."
            exit 1
          fi
          echo "Secret check passed: No local .env detected."

  build-and-typecheck:
    name: TypeScript Build & Lint Check
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Compile TypeScript
        run: npm run build

      - name: Verify Dist Artifacts
        run: |
          test -f dist/server.js || { echo "::error::Build verification failed: dist/server.js not found"; exit 1; }
          echo "✅ Build verified successfully. All TypeScript modules compiled."
