name: PR Validation & Build

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

jobs:
  validate:
    name: Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Compile TypeScript
        run: npm run build

      - name: Verify Dist Build
        run: |
          test -f dist/server.js || { echo "Build failed: dist/server.js not found"; exit 1; }
          echo "Build successful! All TypeScript files compiled."
